<ion-content class="ion-padding">
  <main class="practica">
    <!-- Título: rojo, mayúsculas y centrado con SCSS -->
    <h1 class="practica__titulo">Mi primera página con Sass</h1>

    <!-- Contenedor que alinea el botón Ionic a la derecha -->
    <div class="practica__acciones">
      <ion-button class="practica__boton" type="button">Botón azul</ion-button>
    </div>

    <!-- Imagen local: centrada y con borde verde de 3 píxeles -->
    <img
      class="practica__imagen"
      src="assets/imagen-ejemplo.svg"
      alt="Paisaje ilustrado con montañas, sol y vegetación"
    />
  </main>
</ion-content>
